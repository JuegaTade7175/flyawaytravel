# El tester por defecto apunta a http://localhost:8080
spring.application.name=flyawaytravel
server.port=${SERVER_PORT:8080}

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${DB_NAME:flyawaytravel-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson — serializar fechas como ISO string, NO como arrays numéricos
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT
jwt.secret=flyawaytravel-jwt-secret-key-dbp-2026-utec-change-in-prod
jwt.expiration=86400000

# Async para create-many
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
